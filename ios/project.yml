# XcodeGen spec — run `xcodegen generate` in this folder to produce VocabFolio.xcodeproj.
# The generated project is not committed; this file is the source of truth.
name: VocabFolio
options:
  bundleIdPrefix: com.ottomanlabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  FSRS:
    # Official Swift FSRS (FSRS-6 with the 21-parameter default) — pinned to the
    # exact commit the parity vectors were generated against.
    url: https://github.com/open-spaced-repetition/swift-fsrs
    revision: 4fbaf20184d62f82a9f44f343337c61a2c5483e9

targets:
  VocabFolio:
    type: application
    platform: iOS
    sources:
      - path: VocabFolio
      - path: ../dict.json          # the same dictionary the web app serves
        buildPhase: resources
    info:
      path: VocabFolio/Info.plist
      properties:
        CFBundleDisplayName: Vocab Folio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - "AfacadFlux[slnt,wght].ttf"
          - "Newsreader[opsz,wght].ttf"
          - "Newsreader-Italic[opsz,wght].ttf"
          - Prata-Regular.ttf
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ottomanlabs.vocabfolio
        MARKETING_VERSION: "1.11"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""       # set your team in Xcode → Signing & Capabilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: false
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: FSRS
        product: FSRS
    scheme:
      testTargets:
        - VocabFolioTests

  VocabFolioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VocabFolioTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ottomanlabs.vocabfolio.tests
        SWIFT_VERSION: "5.10"
    dependencies:
      - target: VocabFolio
      - package: FSRS
        product: FSRS
